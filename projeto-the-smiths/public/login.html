        <div class="login">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="container-login">
                <div class="card card-login">
                    <h2>Olá de volta!</h2>
                    <div class="formulario">
                        <div class="campo">
                            <span>E-mail:</span>
                            <input id="email_input" type="text" placeholder="Login">
                        </div>
                        <div class="campo">
                            <span>Senha:</span>
                            <input id="senha_input" type="password" placeholder="******">
                        </div>
                        <button class="botao" onclick="entrar()">Entrar</button>
                    </div>

</html>

<script>


    function entrar() {
        var emailVar = email_input.value.trim();
        var senhaVar = senha_input.value.trim();

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha todos os dados!";
            return false;
        } else {
            setTimeout(sumirMensagem, 5000);
        }

        aguardar();

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        })
            .then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!");

                if (resposta.ok) {
                    resposta.json().then(json => {
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;

                        irParaProximaPagina();
                    });
                } else {
                    resposta.text().then(function (texto) {
                        cardErro.style.display = "block";
                        mensagem_erro.innerHTML = texto || "E-mail ou senha incorretos.";
                        finalizarAguardar();
                    });
                }
            })
            .catch(function (erro) {
                console.log(erro);
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "Não foi possível conectar ao servidor.";
                finalizarAguardar();
            });

        return false;
    }

    // Se já respondeu ao formulário, vai para a dashboard.
    // Caso contrário, vai para o formulário.
    function irParaProximaPagina() {
        fetch("/pontuacoes/listar/" + sessionStorage.ID_USUARIO)
            .then(function (resposta) {
                window.location.href = resposta.status === 204
                    ? "formulario.html"
                    : "dashboard.html";
            })
            .catch(function () {
                window.location.href = "formulario.html";
            });
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }

</script>
</body>
